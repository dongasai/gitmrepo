name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 推送版本标签时触发
  workflow_dispatch:  # 手动触发

jobs:
  # 1. 构建各平台二进制文件
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # 一个平台失败不影响其他平台
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            output: git-mrepo-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            output: git-mrepo-linux-arm64
          # macOS ARM
          - os: macos-latest
            target: aarch64-apple-darwin
            output: git-mrepo-darwin-arm64
          # TODO: 以下平台待修复
          # - os: macos-13
          #   target: x86_64-apple-darwin
          #   output: git-mrepo-darwin-x64
          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc
          #   output: git-mrepo-win32-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/git-mrepo dist/${{ matrix.output }}
          chmod +x dist/${{ matrix.output }}

      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/git-mrepo.exe dist/${{ matrix.output }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          retention-days: 1

  # 2. 发布 GitHub Release
  release:
    name: Create GitHub Release
    needs: build
    if: always()  # 即使部分构建失败也创建 Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
        continue-on-error: true

      - name: List downloaded files
        run: |
          ls -la dist/ || echo "dist directory is empty or not found"
          chmod +x dist/git-mrepo-* 2>/dev/null || true

      - name: Check binaries exist
        id: check
        run: |
          if [ -n "$(ls -A dist/ 2>/dev/null)" ]; then
            echo "has_files=true" >> $GITHUB_OUTPUT
          else
            echo "has_files=false" >> $GITHUB_OUTPUT
            echo "Warning: No binaries to release"
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.has_files == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
