name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 推送版本标签时触发
  workflow_dispatch:  # 手动触发

jobs:
  # 1. 构建各平台二进制文件
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            output: git-mrepo-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            output: git-mrepo-linux-arm64
          # macOS
          - os: macos-13
            target: x86_64-apple-darwin
            output: git-mrepo-darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            output: git-mrepo-darwin-arm64
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            output: git-mrepo-win32-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/git-mrepo dist/${{ matrix.output }}
          chmod +x dist/${{ matrix.output }}

      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/git-mrepo.exe dist/${{ matrix.output }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          retention-days: 1

  # 2. 发布 GitHub Release
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all binaries
        run: |
          mkdir -p dist
          for artifact in git-mrepo-linux-x64 git-mrepo-linux-arm64 git-mrepo-darwin-x64 git-mrepo-darwin-arm64 git-mrepo-win32-x64.exe; do
            echo "Downloading $artifact..."
            gh run download ${{ github.run_id }} -n "$artifact" --dir dist || echo "Warning: $artifact not found"
          done
          chmod +x dist/git-mrepo-*
          ls -la dist/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
