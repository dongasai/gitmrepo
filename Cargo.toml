[package]
name = "git-mrepo"
version = "0.1.0"
edition = "2021"
authors = ["dongasai"]
description = "Git modular repository management tool - manage main repo and sub-repos independently"
license = "MIT"
repository = "https://github.com/dongasai/git-mrepo"
keywords = ["git", "repository", "modules", "monorepo"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI 命令解析
clap = { version = "4", features = ["derive"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

# Git 辅助功能
git2 = { version = "0.18", features = ["vendored-libgit2"] }

# 错误处理
anyhow = "1"
thiserror = "1"

# 路径处理
path-absolutize = "3"

[dev-dependencies]
# 测试
tempfile = "3"

[[bin]]
name = "git-mrepo"
path = "src/main.rs"